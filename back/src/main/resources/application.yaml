spring:
  application:
    name: food-logistics-erp

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml

logging:
  file:
    path: ${LOG_PATH:logs}